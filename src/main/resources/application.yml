spring:
  application:
    name: OOPsFramework

  datasource:
    url: jdbc:postgresql://localhost:5432/OOPs
    username: postgres
    password: 236514
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
    show-sql: true

  sql:
    init:
      mode: always

logging:
  level:
    root: INFO
    ru.ssau.tk._shederu_._lab1_: DEBUG
    org.springframework.security: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} - %logger{36} - %msg%n"
  file:
    name: logs/app.log
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 10
